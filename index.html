<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4E89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almacén">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Buscador del almacén</title>
<meta name="description" content="Busca un producto por nombre o referencia y se ilumina su sitio en el plano del almacén.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap">
<style>
/* Layout: una columna — plano arriba, buscador debajo; al elegir un producto se ilumina su sitio */
:root {
  --bg: #F3F4F2;
  --surface: #FFFFFF;
  --ink: #1F2328;
  --muted: #6A7077;
  --line: #D9DCD6;
  --wall: #2A2E33;
  --rack: #C3C8CD;
  --rack-ink: #2A2E33;
  --door: #A9AEB4;
  --hl: #FFB000;
  --hl-ink: #7A4B00;
  --font: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518; --surface: #1C1F23; --ink: #ECEEF0; --muted: #9AA1A8; --line: #2D3238;
    --wall: #D9DCD6; --rack: #4A5058; --rack-ink: #ECEEF0; --door: #6B727A; --hl: #FFB000; --hl-ink: #FFD27A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131518; --surface: #1C1F23; --ink: #ECEEF0; --muted: #9AA1A8; --line: #2D3238;
  --wall: #D9DCD6; --rack: #4A5058; --rack-ink: #ECEEF0; --door: #6B727A; --hl: #FFB000; --hl-ink: #FFD27A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font: 800 1.55rem/1.1 var(--font); margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }

/* Plano */
#plan { display: block; width: 100%; height: auto; }
.zone { fill: var(--surface); transition: fill .25s; }
.wall { fill: none; stroke: var(--wall); stroke-width: .28; stroke-linejoin: miter; }
.wall-in { stroke: var(--wall); stroke-width: .16; }
.div { stroke: var(--wall); stroke-width: .08; stroke-dasharray: .3 .3; }
.rack { fill: var(--rack); stroke: var(--surface); stroke-width: .04; transition: fill .25s, opacity .25s; }
.secdiv { stroke: var(--surface); stroke-width: .07; stroke-dasharray: .3 .2; pointer-events: none; }
.sec { font: 700 .62px var(--font); fill: var(--rack-ink); text-anchor: middle;  pointer-events: none; }
.gap { stroke: var(--surface); stroke-width: .3; }
.door, .arc { stroke: var(--door); stroke-width: .07; fill: none; }
.stairs { fill: var(--surface); stroke: var(--door); stroke-width: .08; }
.step { stroke: var(--door); stroke-width: .05; }
.hook { stroke: var(--wall); stroke-width: .045; stroke-linecap: round; }
.hookdot { fill: var(--wall); }
.halo { fill: transparent; transition: fill .25s; }
.pas circle { fill: #2A2E33; transition: fill .25s; }
.pas text { font: 700 .5px var(--font); fill: #FFFFFF; text-anchor: middle;  }
.zlabel rect { fill: var(--bg); }
.zlabel text { font: 700 .62px var(--font); fill: var(--ink); text-anchor: middle;  letter-spacing: .02px; }


/* Colores de estancias */
:root { --z-alm:#E3EEFA; --z-rec:#FFF5D1; --z-bun:#E2F3E5; --z-ban:#FBE2E2; --z-tal:#FFFFFF;
  --zi-alm:#1D4E89; --zi-rec:#7A5A00; --zi-bun:#2C6A3A; --zi-ban:#8E2B2B; --zi-tal:#2A2E33; --zl-bg:#FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --z-alm:#1C2A3A; --z-rec:#33301F; --z-bun:#1D2F22; --z-ban:#382124; --z-tal:#1C1F23;
  --zi-alm:#9CC3F0; --zi-rec:#F0D37A; --zi-bun:#9FD8AB; --zi-ban:#F2A7A7; --zi-tal:#ECEEF0; --zl-bg:#131518; } }
:root[data-theme="dark"] { --z-alm:#1C2A3A; --z-rec:#33301F; --z-bun:#1D2F22; --z-ban:#382124; --z-tal:#1C1F23;
  --zi-alm:#9CC3F0; --zi-rec:#F0D37A; --zi-bun:#9FD8AB; --zi-ban:#F2A7A7; --zi-tal:#ECEEF0; --zl-bg:#131518; }
.zone.t-alm{fill:var(--z-alm)} .zone.t-rec{fill:var(--z-rec)} .zone.t-bun{fill:var(--z-bun)} .zone.t-ban{fill:var(--z-ban)} .zone.t-tal{fill:var(--z-tal)}
.zlabel rect{fill:var(--zl-bg)}
.zlabel.t-alm text{fill:var(--zi-alm)} .zlabel.t-rec text{fill:var(--zi-rec)} .zlabel.t-bun text{fill:var(--zi-bun)} .zlabel.t-ban text{fill:var(--zi-ban)} .zlabel.t-tal text{fill:var(--zi-tal)}


/* El plano siempre en claro (como un papel), también en modo oscuro */
.map { --surface:#FFFFFF; --ink:#1F2328; --wall:#2A2E33; --rack:#C3C8CD; --rack-ink:#2A2E33; --door:#A9AEB4; --bg:#F3F4F2;
  --z-alm:#E3EEFA; --z-rec:#FFF5D1; --z-bun:#E2F3E5; --z-ban:#FBE2E2; --z-tal:#FFFFFF;
  --zi-alm:#1D4E89; --zi-rec:#7A5A00; --zi-bun:#2C6A3A; --zi-ban:#8E2B2B; --zi-tal:#2A2E33; --zl-bg:#FFFFFF;
  background:#FFFFFF; color-scheme: light; }

/* Resaltado */
/* Al elegir: todo apagado menos la estancia del producto; su sitio en color vivo de la estancia */
:root { --v-alm:#3F8EF0; --v-bun:#34B062; --v-rec:#F0B90B; --v-ban:#E5534B; --v-tal:#8A9096; }
[data-z] { transition: opacity .25s, fill .25s; }
.rack.hl[data-t="alm"] { fill: var(--v-alm); } .rack.hl[data-t="bun"] { fill: var(--v-bun); }
.rack.hl[data-t="rec"] { fill: var(--v-rec); } .rack.hl[data-t="ban"] { fill: var(--v-ban); }
.rack.hl { animation: pulse 1.4s ease-in-out infinite; }
.zone.hl[data-t="alm"] { fill: color-mix(in srgb, var(--v-alm) 40%, var(--z-alm)); }
.zone.hl[data-t="bun"] { fill: color-mix(in srgb, var(--v-bun) 40%, var(--z-bun)); }
.zone.hl[data-t="rec"] { fill: color-mix(in srgb, var(--v-rec) 40%, var(--z-rec)); }
.zone.hl[data-t="ban"] { fill: color-mix(in srgb, var(--v-ban) 40%, var(--z-ban)); }
.zone.hl { animation: pulse 1.4s ease-in-out infinite; }
.pk.hl[data-t="alm"] .halo { fill: var(--v-alm); } .pk.hl[data-t="bun"] .halo { fill: var(--v-bun); }
.pk.hl .halo { animation: pulse 1.4s ease-in-out infinite; }
.pas.hl circle { fill: var(--v-alm); }
.pas.hl text { fill: #FFFFFF; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .hl, .pk.hl .halo { animation: none !important; } }

/* Buscador */
.search { position: relative; }
.search input {
  width: 100%; background: var(--surface); border: 2px solid #3F8EF0; border-radius: 12px;
  box-shadow: 0 0 0 4px color-mix(in srgb, #3F8EF0 18%, transparent), 0 2px 10px color-mix(in srgb, #3F8EF0 22%, transparent);
  padding: 13px 44px 13px 14px; font: 600 1.05rem var(--font);
}
.search input:focus { outline: none; border-color: #2F7BE0; box-shadow: 0 0 0 5px color-mix(in srgb, #3F8EF0 30%, transparent), 0 2px 14px color-mix(in srgb, #3F8EF0 30%, transparent); }
.clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; border-radius: 8px; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
.list { display: grid; gap: 6px; }
.item {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.item:hover { border-color: var(--ink); }
.item.sel { border-color: var(--hl); box-shadow: 0 0 0 2px color-mix(in srgb, var(--hl) 45%, transparent); }
.item b { font-weight: 700; display: block; }
.item .ref { display: block; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; margin-top: 1px; }
.item .ref:empty { display: none; }
.item small { color: var(--muted); font-size: .8rem; text-align: right; flex: none; max-width: 52%; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 2px; }
.where { display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--hl) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--hl) 55%, transparent); border-radius: 12px; padding: 12px 14px; }
.where .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--hl); flex: none; }
.where .what { font: 800 1.05rem var(--font); }
.where .loc { color: var(--hl-ink); font-weight: 600; font-size: .92rem; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
</style>

</head>

const $ = id => document.getElementById(id);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
let sel = null;

function render() {
  const q = norm($("q").value);
  $("clear").hidden = !$("q").value;
  const box = $("list");
  box.innerHTML = "";
  if (!q) return;                       // sin texto no se enseña nada
  const qq = q.replace(/[\s\-\/.,]/g, "");
  const list = PRODUCTOS.filter(p => {
    const txt = norm([p.n, p.r, p.a, p.d, p.k].join(" "));
    return txt.includes(q) || txt.replace(/[\s\-\/.,]/g, "").includes(qq) || q.split(" ").every(w => txt.includes(w));
  });
  if (!list.length) { box.innerHTML = `<div class="empty">No encuentro «${$("q").value.replace(/</g, "&lt;")}». Prueba con otra palabra.</div>`; return; }
  for (const p of list) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item" + (sel === p ? " sel" : "");
    b.innerHTML = `<span><b></b><span class="ref"></span></span><small></small>`;
    b.querySelector("b").textContent = p.n;
    b.querySelector(".ref").textContent = p.r ? "Ref. " + p.r + (p.a ? " · " + p.a : "") : "";
    b.querySelector("small").textContent = p.d;
    b.onclick = () => pick(p);
    box.appendChild(b);
  }
}
function pick(p) {
  sel = sel === p ? null : p;          // tocar otra vez el mismo lo apaga
  const plan = $("plan");
  plan.querySelectorAll(".hl").forEach(el => el.classList.remove("hl"));
  plan.querySelectorAll(".off").forEach(el => el.classList.remove("off"));
  plan.classList.toggle("has-hl", !!(sel && sel.t.length));
  $("where").hidden = !sel;
  if (sel) {
    const zs = new Set(), ts = new Set();
    sel.t.forEach(id => { const el = document.getElementById(id); if (el) { el.classList.add("hl"); zs.add(el.dataset.z); ts.add(el.dataset.t); } });
    plan.querySelectorAll("[data-z]").forEach(el => el.classList.toggle("off", !zs.has(el.dataset.z)));
    const t = ts.size === 1 ? [...ts][0] : "alm";
    $("where").style.setProperty("--hl", `var(--v-${t})`);
    $("where").style.setProperty("--hl-ink", `var(--zi-${t})`);
    $("whereWhat").textContent = sel.n + (sel.r ? " · Ref. " + sel.r : "");
    $("whereLoc").textContent = sel.d;
    $("plan").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  render();
}
$("q").addEventListener("input", render);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const first = $("list").querySelector(".item"); if (first) first.click(); } });
$("clear").onclick = () => { $("q").value = ""; render(); $("q").focus(); };
render();

// Ajusta el fondo de cada nombre de estancia al tamaño real del texto
function fitLabels() {
  document.querySelectorAll("#plan .zlabel").forEach(g => {
    const t = g.querySelector("text"), r = g.querySelector("rect"), b = t.getBBox();
    const px = .32, py = .16;
    r.setAttribute("x", b.x - px); r.setAttribute("y", b.y - py);
    r.setAttribute("width", b.width + px * 2); r.setAttribute("height", b.height + py * 2);
  });
}
fitLabels();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
